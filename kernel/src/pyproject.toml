[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-agent-kernel"
version = "0.4.0"
description = "debrief data kernel: SQLite portfolio ledger, collection worker, and JSON CLI (no agent, no LLM)"
requires-python = ">=3.11"
# Core = everything the debrief CLI needs for read/write commands. Collector
# packages (data sources + APScheduler + notifications) live in the
# `collectors` extra so the CLI distributes as a slim pure-Python wheel.
dependencies = [
    "sqlalchemy>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
collectors = [
    "yfinance>=0.2.40",
    "akshare>=1.14.0",
    "pycoingecko>=3.1.0",
    "apscheduler>=3.10.0",
    "python-telegram-bot>=20.0",
    "pyyaml>=6.0",
    "tomlkit>=0.13,<1",
]
ui = [
    "streamlit[auth]>=1.66.0,<2",
    "plotly>=5.24,<7",
]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff==0.14.1",
]

[project.scripts]
debrief = "debrief.cli:main"

[tool.setuptools]
py-modules = ["config", "runtime"]

[tool.setuptools.packages.find]
include = ["common*", "adapters*", "db*", "domain*", "memory*", "notifier*", "scheduler*", "debrief*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".worktrees", "dist", ".venv", ".venv-debrief"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Fixture classes deliberately use small callable attributes.
"tests/test_citations.py" = ["E731"]
# Manual integration script configures its import path before loading the app.
"tests/test_manual_trigger_all_jobs.py" = ["E402"]

[tool.coverage.run]
source = ["domain", "common", "adapters", "app", "db", "memory", "scheduler", "debrief", "notifier", "runtime"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
